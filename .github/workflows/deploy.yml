name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # base_path: "" для собственного домена (toddlers.edu.kz), "/toddlers-kindergarten" для cpio1.github.io
      - id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify export
        run: |
          test -f out/index.html || { echo "out/index.html not found"; exit 1; }
          test -d out/_next || { echo "out/_next not found"; exit 1; }
          echo "base_path='${{ steps.pages.outputs.base_path }}'"
          # Ссылки на _next/static в HTML должны начинаться ровно с base_path
          grep -q "\"${{ steps.pages.outputs.base_path }}/_next/static/" out/index.html \
            || { echo "index.html: asset paths do not match base_path"; exit 1; }
          touch out/.nojekyll
          ls out/gallery

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
